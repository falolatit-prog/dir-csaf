name: Mobile unit tests
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-tests.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-tests.yml'
jobs:
  queue-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline queue tests
        working-directory: mobile
        run: npm test
